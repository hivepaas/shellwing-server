name: Web

# What a pull request must keep working: the server web app type-checks, lints
# and builds - with the lockfile as it is and the Node the backend's image
# builds it with. A dependency update that breaks it fails here, not after it is
# merged.

on:
    push:
        branches: [main]
        paths: ["web/**", ".github/workflows/web.yml"]
    pull_request:
        branches: [main]
        paths: ["web/**", ".github/workflows/web.yml"]

permissions:
    contents: read

jobs:
    web:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  # As the dashboard it was made from: node:26.
                  node-version: "26"
                  cache: yarn
                  cache-dependency-path: web/yarn.lock
            - run: yarn install --frozen-lockfile
            - run: yarn lint:ci
            - run: yarn build
