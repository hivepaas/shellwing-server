name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in the shellwing server"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please search existing issues before creating a new one to avoid duplicates.

  - type: input
    id: version
    attributes:
      label: "Server Version"
      description: "Which version of the server? (e.g. v1.0.0, latest dev)"
      placeholder: "e.g. latest dev"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "Environment / OS"
      description: "Browser and operating system"
      placeholder: "e.g. Chrome 141 on macOS 15"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Describe the Bug"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Steps to reproduce the behavior:"
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "A clear and concise description of what you expected to happen."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Relevant Logs / Screenshots"
      description: "Please paste any relevant logs from the server server or the browser console."
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I have searched existing issues and this is not a duplicate."
          required: true
        - label: "I have provided all necessary logs and context."
          required: false
