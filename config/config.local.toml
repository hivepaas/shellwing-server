env = "development"
platform = "local"
root_domain = "localhost"
app_domain = "localhost"
secret = "abc123"
app_path = ".appdata/shellwing"
# The web app runs on its own port while developing (yarn dev); the links the server sends point there.
web_base_url = "http://localhost:4200"

[users]
    self_signup_enabled = true

[users.admin]
    username = "admin"
    email = "tiendc.lp@gmail.com"
    password = "abc123"

[db]
    host = "localhost"
    port = 47432
    user = "shellwing"
    password = "abc123"
    db_name = "shellwing"
    ssl_mode = "disable"

[cache]
    url = "redis://default:abc123@localhost:47379/0"
    use_tls = false

[http_server]
    # Not the default, 10100: the portal runs there while developing.
    port = 10200
    cors_allow_origins = ["*"]

[session]
    last_access_update_period = "1m"
    passcode_timeout = "60s"
    device_trusted_period = "48h" # 2-days

    jwt_secret = "abc123"
    access_token_exp = "8h"
    refresh_token_exp = "16h"
    session_max_exp = "24h"

    # The same three for admin sessions, which can change the whole install.
    # Any of them set to "0s" falls back to the shared value above.
    admin_access_token_exp = "30m"
    admin_refresh_token_exp = "1h"
    admin_session_max_exp = "8h"

    basic_auth_username = "shellwing"
    basic_auth_password = "abc123"

[dev_mode]
    user_limit = 100
