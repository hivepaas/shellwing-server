<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link
            rel="icon"
            type="image/svg+xml"
            href="/src/assets/icons/logo/logo.icon.svg"
        />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>shellwing server</title>
        <script>
            (function () {
                try {
                    var mode = localStorage.getItem("shellwing-color-mode") || "system";
                    var dark =
                        mode === "dark" ||
                        (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
                    if (dark) {
                        document.documentElement.classList.add("dark");
                    }
                } catch (e) {
                    /* private mode: fall through to light */
                }
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script
            type="module"
            src="/src/main.tsx"
        ></script>
    </body>
</html>
